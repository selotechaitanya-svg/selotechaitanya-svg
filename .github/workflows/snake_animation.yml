name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/snake-dark.svg?palette=github-dark&color_dots=#161b22,#2ea043,#39d353,#56d364,#7ee787
        env:
          GITHUB_TOKEN: ${{ secrets.PACMAN_TOKEN || secrets.GH_TOKEN || secrets.PAT || secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Enhance Low Contribution Visibility
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            ['snake-dark.svg', 'snake.svg'].forEach(file => {
              const p = path.join('dist', file);
              if (!fs.existsSync(p)) return;
              let svg = fs.readFileSync(p, 'utf8');
              svg = svg.replace(/--c1:#01311f;/g, '--c1:#2ea043;');
              svg = svg.replace(/--c2:#034525;/g, '--c2:#39d353;');
              fs.writeFileSync(p, svg, 'utf8');
            });
          "

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
