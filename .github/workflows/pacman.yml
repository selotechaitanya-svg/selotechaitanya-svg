# ═══════════════════════════════════════════════════════════════════════════
# GitHub Action: .github/workflows/pacman.yml
# ═══════════════════════════════════════════════════════════════════════════
# • Generates animated Pacman & Snake games eating all contribution cells.
# • Displays every contribution (even 1 single contribution in a day).
# • Automatically loops: resets after clearing all dots and starts over.
# • Pushes both dark and light SVGs to the 'output' branch.
# ═══════════════════════════════════════════════════════════════════════════

name: Generate Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *"     # Execute every 12 hours
  workflow_dispatch:            # Allows manual one-click run
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate Snake Contribution Graph (Alternative)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF69B4&color_dots=#ebedf0,#F8BBD0,#EF93C4,#FF69B4,#9C27B0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF69B4&color_dots=#161b22,#591942,#8E2A5F,#EF93C4,#FF69B4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
